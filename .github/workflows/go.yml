name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: 'stable'

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

  action:
    name: GitHub Action
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Render roadmap.yml
      uses: ./
      with:
        tool: markdown
        files: roadmap.yml
        args: --output ${{ runner.temp }}/roadmap.md

    - name: Check output
      run: test -s "${{ runner.temp }}/roadmap.md"
